    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WG Pulse — Commercial Credit Recovery Control</title>
    <meta
      name="description"
      content="WG Pulse: Commercial Credit leasing and finance recovery intelligence platform for AERS master lookup, DPD 91 borderline control, Below 1 (90 Ratio) planning, XP rewards, and FB Incentive tracking."
    />
    <meta property="og:title" content="WG Pulse — Commercial Credit Recovery Control" />
    <meta
      property="og:description"
      content="WG Pulse: Commercial Credit leasing and finance recovery intelligence platform for AERS master lookup, DPD 91 borderline control, Below 1 (90 Ratio) planning, XP rewards, and FB Incentive tracking."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f7f6f4] text-zinc-900 dark:bg-[#0f1115] dark:text-zinc-100 antialiased">
    <div id="root">
      <div role="status" style="font-family:system-ui,sans-serif;padding:2rem;color:#334155">
        Loading WG Pulse…
      </div>
    </div>
    <script>
      (() => {
        const showStartupError = (detail) => {
          const root = document.getElementById('root');
          if (!root || root.dataset.appReady === 'true') return;
          root.replaceChildren();

          const panel = document.createElement('main');
          panel.style.cssText = 'font:16px/1.5 system-ui,sans-serif;max-width:680px;margin:12vh auto;padding:24px;color:#0f172a';
          const heading = document.createElement('h1');
          heading.textContent = 'WG Pulse could not start';
          heading.style.color = '#b91c1c';
          const message = document.createElement('p');
          message.textContent = 'The app files did not load correctly. Please reload this page. If the problem continues, share this message with your administrator.';
          const error = document.createElement('pre');
          error.textContent = String(detail || 'Unknown startup error');
          error.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:12px;border-radius:8px;font-size:12px';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Reload app';
          retry.style.cssText = 'padding:10px 16px;border:0;border-radius:8px;background:#047857;color:white;font-weight:600;cursor:pointer';
          retry.addEventListener('click', () => window.location.reload());
          panel.append(heading, message, error, retry);
          root.append(panel);
        };

        window.addEventListener('error', (event) => {
          if (event.error || event.target instanceof HTMLScriptElement) {
            showStartupError(event.message || 'A JavaScript file failed to load.');
          }
        });
        window.addEventListener('unhandledrejection', (event) => {
          showStartupError(event.reason instanceof Error ? event.reason.message : event.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
